# Cache lifetime by file type. Done with maps rather than `if` blocks, because
# an add_header inside an `if` discards every add_header from the enclosing
# location (which would strip the security headers below).
map $uri $arcus_expires {
  # Pages (.html), their RSC payloads (.txt) and server.json are revalidated on
  # every load: pages name the hashed chunks of the build they came from, so a
  # stale page outliving a deploy would request chunks that no longer exist.
  default                                                              -1;
  # Content-hashed build output never changes under the same name
  ~^/_next/static/                                                     max;
  # Media and font files
  ~*\.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$  1M;
  ~*\.(?:ttf|ttc|otf|eot|woff|woff2)$                                  1M;
}

# Build output, media and the RSC payloads Next prefetches are not access logged
map $uri $arcus_loggable {
  default                                                                                     1;
  # Except the legacy client's paths, to show which browsers still run it
  ~^/(?:build/dist|src)/                                                                      1;
  ~^/_next/                                                                                   0;
  ~*\.(?:txt|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|ttf|ttc|otf|eot|woff|woff2|css|js)$  0;
}

server {
  listen 8096;
  listen [::]:8096 ipv6only=on;

  server_tokens off;
  access_log /var/log/nginx/access.log main if=$arcus_loggable;
  # TLS ends at the ingress, so redirects must not name this server's own
  # scheme and port
  absolute_redirect off;

  add_header 'X-Frame-Options' 'SAMEORIGIN' always;
  add_header 'X-Content-Type-Options' 'nosniff' always;
  add_header 'Referrer-Policy' 'same-origin' always;
  add_header 'Strict-Transport-Security' 'max-age=31536000' always;
  add_header 'Content-Security-Policy' "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
  add_header 'Permissions-Policy' 'camera=(), microphone=(), geolocation=(), payment=(), usb=()' always;

  root   /usr/share/nginx/html;
  expires $arcus_expires;
  error_page 404 /404.html;

  location = / {
    try_files /index.html =404;
  }

  # Each route is exported as a file (/home -> home.html), next to a directory
  # of the same name holding its payloads. Send /home/ to /home rather than
  # serving that directory.
  location ~ ^(?<route>/.+)/$ {
    return 308 $route$is_args$args;
  }

  # The legacy client's script bundles. A browser still running the legacy page
  # (a tab left open, or its index.html, which the legacy server sent without
  # caching headers, still fresh in the browser's cache) requests these as it
  # navigates. Answer with a script that reloads it once: a reload revalidates
  # the page, which brings up this client instead.
  location ~ ^/build/dist/.+\.js$ {
    default_type application/javascript;
    return 200 "try { if (!sessionStorage.getItem('arcus-legacy-reload')) { sessionStorage.setItem('arcus-legacy-reload', '1'); location.reload(); } } catch (e) {}\n";
  }

  location / {
    try_files $uri $uri.html =404;
  }
}
