# Local containerized instance of the production images, for testing against
# the dev platform.
#
# Auth flow (scripted-login): browse to https://localdev.myDevUrl.com:8443/login
# and sign in. The app POSTs credentials to ARCUS_HTTP_URI/login; the platform
# sets the irisAuthToken cookie scoped to .myDevUrl.com. Because Caddy serves
# the app over HTTPS at the same-site hostname, the browser attaches that
# cookie to the direct wss:// handshake and the session restores.
#
# Prereq: /etc/hosts must map  127.0.0.1  localdev.myDevUrl.com  (already set).
#
#   docker compose up --build

services:
  ui:
    build:
      context: .
      dockerfile: docker/ui-server/Dockerfile
    # Read at container start, as in production: change and `docker compose up -d`.
    environment:
      ARCUS_HTTP_URI: https://client.dev.myDevUrl.com
      ARCUS_WS_URI: wss://client.dev.myDevUrl.com
      ARCUS_REDIRECT_URI: https://client.dev.myDevUrl.com
    expose:
      - "8096"
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    depends_on:
      - ui
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
    restart: unless-stopped
